[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynhts"
version = "0.0.1.dev0"
description = "Typed, survey-weight-aware access to US National Household Travel Survey microdata."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "pooch>=1.8",
    "platformdirs>=3.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy", "types-PyYAML", "pandas-stubs", "openpyxl"]

[tool.hatch.build.targets.wheel]
packages = ["src/pynhts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not data and not network'"
markers = [
    "data: needs the real NHTS 2017 files in the pynhts cache",
    "network: needs internet access",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[[tool.mypy.overrides]]
module = ["pooch", "pooch.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
