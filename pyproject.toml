[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynhts"
version = "0.1.1"
description = "Typed, survey-weight-aware access to US National Household Travel Survey microdata."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = ["NHTS", "travel survey", "transportation", "replicate weights", "jackknife"]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "pooch>=1.8",
    "platformdirs>=3.10",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/sabernaseralavi-60/pynhts"
Issues = "https://github.com/sabernaseralavi-60/pynhts/issues"
Changelog = "https://github.com/sabernaseralavi-60/pynhts/blob/main/CHANGELOG.md"

[project.scripts]
pynhts = "pynhts.cli:main"

[project.optional-dependencies]
torch = ["torch>=2.0"]
graph = ["torch>=2.0", "torch-geometric>=2.4"]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy", "types-PyYAML", "pandas-stubs", "openpyxl"]

[tool.hatch.build.targets.wheel]
packages = ["src/pynhts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not data and not network'"
markers = [
    "data: needs the real NHTS 2017 files in the pynhts cache",
    "network: needs internet access",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"tools/*" = ["D"]
"src/pynhts/recipes/stt2017.py" = ["D102", "D103"]  # one-line target functions, see module doc
"src/pynhts/recipes/mcnally_rafiq2021.py" = ["D102", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[[tool.mypy.overrides]]
module = ["pooch", "pooch.*", "pyarrow", "pyarrow.*", "torch", "torch.*", "torch_geometric", "torch_geometric.*"]
ignore_missing_imports = true
