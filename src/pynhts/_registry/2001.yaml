# NHTS 2001 (Version 4, national sample with add-ons) file registry. Hashes verified
# 2026-10-21 by downloading the archives from the official ORNL server and hashing
# every member. The archive is called Ascii.zip but holds comma-separated CSV files.
# NOTE: nhts.ornl.gov answers HTTP 200 with an HTML page for missing files.
wave: 2001
source_page: https://nhts.ornl.gov
variance:
  method: jkn
  replicates: 99
  factor: 0.98989898989899
  df: 99
  design:
    factor: 0.98989898989899
    df: 98
  description: delete-one jackknife with 99 replicate weights as in the 2001 User's Guide (variance =
    98/99 times the sum of squared deviations; t multiplier on 99 degrees of freedom)
  default_weights:
    longdist: WTPTPFIN
  weight_rtol: 1.0e-09
  replicate_files:
    hh50wt.csv:
    - level: household
      weight: WTHHFIN
      prefix: WTHFIN
      keys:
      - HOUSEID
      out: repw_household.parquet
      rename:
        ID9: HOUSEID
    pr50wt.csv:
    - level: person
      weight: WTPERFIN
      prefix: WTPFIN
      keys:
      - HOUSEID
      - PERSONID
      out: repw_person.parquet
      rename:
        ID9: HOUSEID
    - level: trip
      weight: WTTRDFIN
      prefix: WTTDFN
      keys:
      - HOUSEID
      - PERSONID
      out: repw_trip.parquet
      rename:
        ID9: HOUSEID
    ldt50wt.csv:
    - level: longdist
      weight: WTPTPFIN
      prefix: FPTPWT
      keys:
      - HOUSEID
      - PERSONID
      out: repw_longdist.parquet
      pad: 2
