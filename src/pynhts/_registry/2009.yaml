# NHTS 2009 (Version 2.1, October 2011) file registry. Hashes verified 2026-10-21 by
# downloading the archives from the official ORNL server and hashing every member.
# NOTE: nhts.ornl.gov answers HTTP 200 with an HTML page for missing files, so only the
# SHA-256 below proves that a download is the real file. The CSV files sit in the
# archive folder Ascii/ (zip_path).
wave: 2009
source_page: https://nhts.ornl.gov
variance:
  method: jkn
  replicates: 100
  factor: 0.99
  df: 100
  design:
    factor: 1.0
    df: 99
  description: jackknife-2 (JK2) with 100 replicate weights as in the 2009 User's Guide (variance = 99/100
    times the sum of squared deviations; t multiplier on 100 degrees of freedom)
  replicate_files:
    hh50wt.csv:
    - level: household
      weight: HHWGT
      keys:
      - HOUSEID
      out: repw_household.parquet
    per50wt.csv:
    - level: person
      weight: WTPERFIN
      keys:
      - HOUSEID
      - PERSONID
      out: repw_person.parquet
    - level: trip
      weight: DAYWGT
      keys:
      - HOUSEID
      - PERSONID
      out: repw_trip.parquet
      fill_from:
        level: person
        factor: 365
citation: 'U.S. Department of Transportation, Federal Highway Administration, 2009 National Household
  Travel Survey, Version 2.1 (2011). URL: https://nhts.ornl.gov'
