# NHTS 2017 (v1.2 / 2019 release) file registry. Hashes verified 2026-10-16 by downloading
# the archives from the official ORNL server and hashing every member.
# NOTE: nhts.ornl.gov answers HTTP 200 with an HTML page for missing files, so only the
# SHA-256 below proves that a download is the real file.
wave: 2017
source_page: https://nhts.ornl.gov
# Standard errors: stratified delete-one-unit jackknife (JKn) with the 98 replicate weights of
# ReplicatesCSV.zip, 14 variance strata x 7 units (2017 Weighting Report).
variance:
  method: jkn
  replicates: 98
  factor: 0.8571428571428571
  df: 98
  # design convention: the 98 replicates carry 14 variance strata, so 98 - 14 = 84 degrees of
  # freedom (2017 Weighting Report; FHWA's tables use 98)
  design: {factor: 0.8571428571428571, df: 84}
  description: >-
    stratified jackknife (JKn) with 98 replicate weights, 14 variance strata of 7 units (variance = 6/7 times the sum of squared deviations; t multiplier on 98 degrees of freedom)
  replicate_files:
    hhwgt.csv:
      - {level: household, weight: WTHHFIN, keys: [HOUSEID], out: repw_household.parquet}
    perwgt.csv:
      - {level: person, weight: WTPERFIN, keys: [HOUSEID, PERSONID], out: repw_person.parquet}
      - {level: trip, weight: WTTRDFIN, keys: [HOUSEID, PERSONID], out: repw_trip.parquet}
citation: >-
  U.S. Department of Transportation, Federal Highway Administration, 2017 National Household
  Travel Survey, Version 1.2 (2019). URL: https://nhts.ornl.gov
