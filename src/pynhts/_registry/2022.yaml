# NHTS 2022 NextGen (national ABS sample, public-use release dated 2025-05) file registry.
# Hashes verified 2026-10-21 by downloading the archive from the official ORNL server and
# hashing every member. The archive and the documents are served under /media/2022/ (the
# /assets/ path of 2017 does not exist for this wave).
# NOTE: nhts.ornl.gov answers HTTP 200 with an HTML page for missing files, so only the
# SHA-256 below proves that a download is the real file.
wave: 2022
source_page: https://nhts.ornl.gov
citation: >-
  Federal Highway Administration. (2022). 2022 NextGen National Household Travel Survey Core
  Data, U.S. Department of Transportation, Washington, DC. Available online: http://nhts.ornl.gov.
# How standard errors are obtained. The 2022 public files carry NO replicate weights; the User's
# Guide (Appendix 1, "Sampling Errors") prescribes Taylor-series variance with the weight, the
# stratum and the primary sampling unit (HOUSEID). The guide names the stratum variable
# HHSTRATUMID_2010; the public household file carries it as STRATUMID.
variance:
  method: taylor
  description: >-
    Taylor-series linearisation with variance strata (STRATUMID) and household clusters (t multiplier on the design degrees of freedom of each domain)
  strata: STRATUMID
  cluster: HOUSEID
  weight_sets:
    all: ""
    weekday: "5D"
    weekend: "2D"
