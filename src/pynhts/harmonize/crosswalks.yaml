hispanic_household:
  variable: HH_HISP
  variable_by_wave: {2001: HHR_HISP}
  table: household
  source: "codebooks 2001, 2009, 2017, 2022; checked against the data"
  note: >-
    Hispanic origin of the household respondent, a separate yes/no question in all four waves (2001 names the variable HHR_HISP). The 2001 and 2009 race variables also contain Hispanic codes, so the answer to this question is the one to use (race_ethnicity() does).
  rows:
    - {wave: 2001, code: "1", hint: "Yes", category: hispanic, status: exact}
    - {wave: 2001, code: "2", hint: "No", category: not_hispanic, status: exact}
    - {wave: 2009, code: "01", hint: "Yes", category: hispanic, status: exact}
    - {wave: 2009, code: "02", hint: "No", category: not_hispanic, status: exact}
    - {wave: 2017, code: "01", hint: "Yes", category: hispanic, status: exact}
    - {wave: 2017, code: "02", hint: "No", category: not_hispanic, status: exact}
    - {wave: 2022, code: "01", hint: "Hispanic or Latino", category: hispanic, status: exact}
    - {wave: 2022, code: "02", hint: "Not Hispanic or Latino", category: not_hispanic, status: exact}

hispanic_person:
  variable: R_HISP
  table: person
  source: "codebooks 2017 v1.2 and 2022 v2.1"
  note: >-
    Hispanic origin of each person (2017 and 2022 only; 2001 and 2009 have the household respondent's answer only, hispanic_household). The 2022 question is asked of persons 5 or older.
  rows:
    - {wave: 2017, code: "01", hint: "Yes, Hispanic or Latino", category: hispanic, status: exact}
    - {wave: 2017, code: "02", hint: "No, Not Hispanic", category: not_hispanic, status: exact}
    - {wave: 2022, code: "01", hint: "Hispanic", category: hispanic, status: exact}
    - {wave: 2022, code: "02", hint: "Not Hispanic", category: not_hispanic, status: exact}
