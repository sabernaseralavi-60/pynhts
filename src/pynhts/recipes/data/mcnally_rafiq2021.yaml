  - id: complex_share
    table: "Fig 2.7"
    label: "Complex work tours (%)"
    scale: 1
    decimals: 0
    published: 32
    moe: null
    compute: complex_share
    expected: not_reproduced
    note: >-
      30.5 percent here, 33.2 if the two-work-stop tours are counted as complex. The report does not
      say how tours with several work stops and no other stop are allocated.
  - id: work_based_share
    table: "Fig 2.7"
