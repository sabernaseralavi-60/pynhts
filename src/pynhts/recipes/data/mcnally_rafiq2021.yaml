    label: "Home-based work tours with transit (adults)"
    scale: 1
    decimals: 0
    published: 2454
    moe: null
    compute: hbw_tours
    expected: not_reproduced
    note: >-
      2,456 against 2,454 (0.08 percent). Tours closed by code 01 only, adults, work code 03. Closing
      tours also at 02 gives 2,471; the report's exact rule is not stated.
