#   doi 10.1016/j.tra.2020.10.018 and 10.1016/j.tra.2021.07.011, NOT read: paywalled.)
# The report uses UNWEIGHTED counts and percentages: no margins of error (moe: null).
# Status rule and fields: see stt2017.yaml. Percentages are compared at the printed precision.
source: mcnally_rafiq2021
title: "McNally & Rafiq (2021): transit users' work tours on the 2017 NHTS (sample, Figure 2.7, Table 2.1)"
