logging_params:
  log_dir: "/content/caveat_run/logs"
  name: "nhts_split1_full"
schedules_path: "/content/caveat_run/train_schedules.csv"
attributes_path: "/content/caveat_run/train_attributes.csv"
synthetic_attributes_path: "/content/caveat_run/test_attributes.csv"
labels_encoder:
  name: "tokens"
  labels:
    age: nominal
    worker: nominal
    veh: nominal
    weekend: nominal
encoder_params:
  name: "continuous"
  max_length: 16
  norm_duration: 1440
  jitter: 0
  fix_durations: stretch
  trim_eos: True
  weighting: unit
  joint_weighting: unit
model_params:
  name: "CVAEContLSTMCP"
  hidden_n: 4
  hidden_size: 256
  labels_hidden_size: 64
  latent_dim: 6
  dropout: 0.0
  teacher_forcing_ratio: 0.5
  hidden_conditionality: add
  encoder_conditionality: none
  latent_conditionality: add
  decoder_conditionality: none
loader_params:
  train_batch_size: 1024
  val_batch_size: 1024
  num_workers: 2
experiment_params:
  LR: 0.001
  weight_decay: 0.01
  scheduler_gamma: 0.98
  kld_weight: 0.01
  duration_loss_weight: 200
trainer_params:
  patience: 50
  max_epochs: 300
  min_epochs: 100
seed: 1234
